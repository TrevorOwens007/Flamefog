</script>
<style>
:root{
  --bg:#E9EDF1;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#15212E;--muted:#5A6876;--line:#CDD5DD;
  --accent:#1D5FA8;--accent-ink:#FFFFFF;--ok:#1F8A55;--warn:#B98207;--bad:#C2412D;
  --ok-bg:#E3F3EA;--warn-bg:#FBF0D6;--bad-bg:#F8E3DF;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171F;--surface:#18222D;--surface2:#1E2A37;--ink:#E6ECF2;--muted:#93A1AF;--line:#2C3947;
  --accent:#6FA8E8;--accent-ink:#0C1520;--ok:#45B57D;--warn:#E3B23C;--bad:#E8705B;
  --ok-bg:#173126;--warn-bg:#352B12;--bad-bg:#3A1F1A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10171F;--surface:#18222D;--surface2:#1E2A37;--ink:#E6ECF2;--muted:#93A1AF;--line:#2C3947;
  --accent:#6FA8E8;--accent-ink:#0C1520;--ok:#45B57D;--warn:#E3B23C;--bad:#E8705B;
  --ok-bg:#173126;--warn-bg:#352B12;--bad-bg:#3A1F1A;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-family:var(--cond);font-weight:700;font-size:24px;letter-spacing:.5px;white-space:nowrap}
.brand b{display:inline-block;background:var(--warn);color:#15212E;padding:0 6px;margin-right:6px;border-radius:3px}
.role{font-size:14px;opacity:.75;margin-left:auto;white-space:nowrap}
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:19}
.nav-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.nav button{border:0;background:none;padding:12px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1.1;margin:0 0 4px}
h2{font-family:var(--cond);font-weight:600;font-size:24px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.grow{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{min-height:120px;width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn.small{min-height:32px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.yellow{background:var(--warn-bg);color:var(--warn)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--surface2);color:var(--muted)}
.chip.info{background:var(--surface2);color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.summary .s{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
.summary .s .n{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1}
.summary .s .l{font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:12px 14px}
.card.green{border-left-color:var(--ok)}.card.yellow{border-left-color:var(--warn)}.card.red{border-left-color:var(--bad)}
.card .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.lane{height:14px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--line) 8px 10px);overflow:hidden;margin:8px 0 6px;position:relative}
.lane i{display:block;height:100%;background:var(--accent)}
.lane.green i{background:var(--ok)}.lane.yellow i{background:var(--warn)}.lane.red i{background:var(--bad)}
.lane .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700;white-space:nowrap;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.sheet td,table.sheet th{white-space:nowrap;border-right:1px solid var(--line);font-size:14px;padding:4px 8px}
table.sheet .rn{color:var(--muted);background:var(--surface2);text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;background:var(--surface2)}
.drop.on{border-color:var(--accent)}
.warnlist{max-height:220px;overflow:auto;font-size:14px;background:var(--surface2);border-radius:6px;padding:8px 12px;margin:8px 0 0}
.chartbox{position:relative;height:280px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:13px;color:var(--muted);text-align:center;font-weight:700}
.cal button{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;padding:2px;min-height:40px}
.cal button.miss{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cal button.has{background:var(--surface2)}
.cal button.conf{border-color:var(--ok)}
.cal button.off{opacity:.45}
.cal button.sel{outline:3px solid var(--accent)}
.cal .dot{font-size:11px;line-height:1}
.ringwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.notes li{margin-bottom:8px}

<script>
/* ===== Standalone storage: everything stays in this browser (IndexedDB, falls back to localStorage) ===== */
window.SENT_STATUS = 'Opened in email app';
window.openMail = function (to, subject, body) {
  const href = 'mailto:' + encodeURIComponent(to || '') + '?subject=' + encodeURIComponent(subject || '') + '&body=' + encodeURIComponent(body || '');
  const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
};
window.claude = (function () {
  const DBN = 'prs-tracker-standalone', ST = 'kv';
  let idb = null; let mem = {}; const subs = [];
  const openIdb = () => new Promise(res => { try { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
  async function load() {
    idb = await openIdb();
    if (idb) await new Promise(res => { try { const rq = idb.transaction(ST, 'readonly').objectStore(ST).openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { mem[c.key] = c.value; c.continue(); } else res(); }; rq.onerror = () => res(); } catch (e) { res(); } });
    else { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('prs:')) mem[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } } catch (e) { } }
  }
  const persist = (p, v) => new Promise((res, rej) => {
    if (idb) { try { const tx = idb.transaction(ST, 'readwrite'); const os = tx.objectStore(ST); v === undefined ? os.delete(p) : os.put(v, p); tx.oncomplete = () => res(); tx.onerror = () => rej({ code: 'quota_exceeded' }); tx.onabort = () => rej({ code: 'quota_exceeded' }); } catch (e) { rej({ code: 'quota_exceeded' }); } }
    else { try { v === undefined ? localStorage.removeItem('prs:' + p) : localStorage.setItem('prs:' + p, JSON.stringify(v)); res(); } catch (e) { rej({ code: 'quota_exceeded' }); } }
  });
  const notify = () => setTimeout(() => subs.slice().forEach(f => f()), 0);
  const clone = (v) => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const snap = (p) => ({ id: p.split('/').pop(), exists: p in mem, data: () => clone(mem[p]), metadata: { fromCache: false, hasPendingWrites: false } });
  const docRef = (p) => ({
    id: p.split('/').pop(), path: p,
    get: async () => snap(p),
    set: async (d) => { const v = clone(d); await persist(p, v); mem[p] = v; notify(); },
    update: async (d) => { const v = { ...(mem[p] || {}), ...clone(d) }; await persist(p, v); mem[p] = v; notify(); },
    delete: async () => { await persist(p, undefined); delete mem[p]; notify(); },
    onSnapshot: (n) => { let last = null; const f = () => { const s = JSON.stringify(mem[p] === undefined ? null : mem[p]); if (s === last) return; last = s; n(snap(p)); }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; }
  });
  const query = (c, fl) => { const docs = Object.keys(mem).filter(k => k.startsWith(c + '/') && k.split('/').length === c.split('/').length + 1).filter(k => fl.every(([f, v]) => mem[k] && mem[k][f] === v)).sort().map(snap); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  const coll = (c, fl = []) => ({ doc: (id) => docRef(c + '/' + id), where: (f, o, v) => coll(c, [...fl, [f, v]]), get: async () => query(c, fl), onSnapshot: (n) => { let last = null; const f = () => { const q = query(c, fl); const s = JSON.stringify(q.docs.map(d => [d.id, mem[c + '/' + d.id]])); if (s === last) return; last = s; n(q); }; subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; } });
  const db = { doc: docRef, collection: (c) => coll(c) };
  const user = { id: async () => 'local', canEdit: async () => true, search: async () => [], profiles: async () => ({ local: { name: (mem['sup/settings'] && mem['sup/settings'].supervisorName) || 'Supervisor' } }) };
  const ready = load();
  return {
    use: async (n) => { await ready; return n === 'db' ? db : n === 'user' ? user : null; },
    exportAll: async () => { await ready; return { app: 'PRS Tracker', version: 1, exportedAt: new Date().toISOString(), data: clone(mem) }; },
    importAll: async (obj) => { await ready; if (!obj || obj.app !== 'PRS Tracker' || !obj.data) throw new Error('not a backup'); for (const k of Object.keys(mem)) await persist(k, undefined); mem = {}; for (const k in obj.data) { await persist(k, obj.data[k]); mem[k] = obj.data[k]; } },
    clearAll: async () => { await ready; for (const k of Object.keys(mem)) await persist(k, undefined); mem = {}; },
    usage: async () => { await ready; return JSON.stringify(mem).length; }
  };
})();
</script>
<script>
/* ===== PRS sheet parsing (pure functions) ===== */
const FIELD_OPTS = [
  ['ignore', 'Ignore'], ['id', 'Associate ID'], ['name', 'Associate name'], ['date', 'Date'],
  ['shift', 'Shift'], ['prs', 'PRS'], ['spl', 'SPL'], ['atot', 'ATOT'], ['quality', 'Quality %'], ['extra', 'Extra metric']
];
const CORE = ['id', 'name', 'date', 'shift', 'prs', 'spl', 'atot', 'quality'];
const ALIAS_ORDER = ['date', 'shift', 'spl', 'atot', 'quality', 'prs', 'id', 'name'];
const ALIASES = {
  date: [/^(date|day|work date|shift date|report date|week ending|timestamp|dt)$/],
  shift: [/^shift( name| type| code)?$/],
  spl: [/^spl\b/, /\bspl$/],
  atot: [/atot/, /time on task/],
  quality: [/qual/, /accuracy/, /^qa\b/, /error rate/],
  prs: [/\bprs\b/, /^prs/, /^(units?|units? picked|picks?|count|total|volume|output|qty|quantity|placed|units placed)$/],
  id: [/^(associate|emp|employee|staff|worker|user|agent)? ?(id|#|no|number|code)$/, /^(login|badge|badge id|badge no|user ?name|username|alias|emp ?id|eid)$/],
  name: [/^(associate|employee|emp|staff|worker|agent|full|first)? ?name$/, /^(associate|associates|employee|staff|worker|agent|person)$/]
};
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };

function normHeader(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/[_\-.:()\/]/g, ' ').replace(/%/g, '').replace(/\s+/g, ' ').trim();
}
function normKey(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
function isEmpty(v) { return v == null || (typeof v === 'string' && v.trim() === ''); }
function isBlankish(v) { return isEmpty(v) || (typeof v === 'string' && /^(-+|n\/?a|na|none|#n\/a|#div\/0!|#value!|#ref!|null)$/i.test(v.trim())) || typeof v === 'boolean'; }
function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'boolean' || v == null) return null;
  const s = String(v).replace(/[,\s%]/g, '');
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return null;
}
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(y, m, d) {
  if (!(y > 1900 && y < 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1) return null;
  return y + '-' + pad(m) + '-' + pad(d);
}
function toDate(v, dayFirst, allowSerial) {
  if (isEmpty(v)) return null;
  if (typeof v === 'number') {
    if (allowSerial && v > 20000 && v < 80000) {
      const d = new Date(Math.round((Math.floor(v) - 25569) * 86400000));
      return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    return null;
  }
  let s = String(v).trim();
  s = s.replace(/^(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)[a-z]*,?\s+/i, '');
  let m;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) return ymd(+m[1], +m[2], +m[3]);
  if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(\s|$)/.exec(s))) {
    let a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    let mo, d;
    if (a > 12) { d = a; mo = b; } else if (b > 12) { mo = a; d = b; } else if (dayFirst) { d = a; mo = b; } else { mo = a; d = b; }
    return ymd(y, mo, d);
  }
  if ((m = /^(\d{1,2})[\s\-]([A-Za-z]{3,9})\.?[\s\-,]*(\d{2,4})(?:$|[\s,T])/.exec(s))) {
    const mo = MONTHS[m[2].toLowerCase().slice(0, m[2].toLowerCase() === 'sept' ? 4 : 3)];
    let y = +m[3]; if (y < 100) y += 2000;
    return mo ? ymd(y, mo, +m[1]) : null;
  }
  if ((m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2})(st|nd|rd|th)?[,\s\-]+(\d{4})(?:$|[\s,\-T])/.exec(s))) {
    const mo = MONTHS[m[1].toLowerCase().slice(0, 3)];
    return mo ? ymd(+m[4], mo, +m[2]) : null;
  }
  return null;
}
function colLetter(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

/* Convert a SheetJS worksheet to a full grid: every row and column in the sheet's range. */
function gridFromSheet(ws, XLSX) {
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: true, raw: true, range: { s: { r: 0, c: 0 }, e: range.e } });
  const width = range.e.c + 1;
  return grid.map(row => {
    const out = new Array(width).fill(null);
    for (let c = 0; c < width; c++) {
      let v = row[c];
      if (v instanceof Date) {
        const d = new Date(v.getTime() + 30000);
        const hasTime = d.getHours() || d.getMinutes();
        v = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + (hasTime ? ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
      }
      if (typeof v === 'string' && v.trim() === '') v = null;
      out[c] = v === undefined ? null : v;
    }
    return out;
  });
}

function aliasField(h) {
  const n = normHeader(h);
  if (!n) return null;
  for (const f of ALIAS_ORDER) for (const re of ALIASES[f]) if (re.test(n)) return f;
  return null;
}
function detectHeader(grid) {
  let best = -1, bestScore = 1;
  const lim = Math.min(30, grid.length);
  for (let i = 0; i < lim; i++) {
    const row = grid[i] || [];
    let text = 0, nums = 0, non = 0, alias = 0;
    for (const v of row) {
      if (isEmpty(v)) continue;
      non++;
      if (toNum(v) !== null) nums++; else text++;
      if (aliasField(v)) alias++;
    }
    if (non < 2) continue;
    if (nums > non * 0.25 && alias === 0) continue;
    let hasNext = false;
    for (let j = i + 1; j < Math.min(grid.length, i + 6); j++) if ((grid[j] || []).some(v => !isEmpty(v))) { hasNext = true; break; }
    if (!hasNext) continue;
    const score = text + alias * 2;
    if (score > bestScore) { best = i; bestScore = score; }
  }
  return best;
}
function headerSignature(grid, headerRow) {
  if (headerRow < 0) return 'noheader:' + ((grid[0] || []).length);
  return (grid[headerRow] || []).map(v => normHeader(v)).join('|');
}
function colStats(grid, start, c, dayFirst) {
  let non = 0, num = 0, date = 0, text = 0, idLike = 0, email = 0;
  const lim = Math.min(grid.length, start + 300);
  for (let r = start; r < lim; r++) {
    const v = (grid[r] || [])[c];
    if (isBlankish(v)) continue;
    non++;
    const s = String(v).trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) { email++; text++; continue; }
    if (toDate(v, dayFirst, false)) date++;
    else if (toNum(v) !== null) num++;
    else { text++; if (/\d/.test(s) && !/\s/.test(s)) idLike++; }
  }
  return { non, num, date, text, idLike, email };
}
const BAD_WORDS = /(rating|target|expected|goal|rank|total hours|\bhours\b|hrs|month|week no|absent|present|days)/;
function fieldScore(f, h, st) {
  const n = normHeader(h); if (!n || !st.non) return 0;
  const numR = st.num / st.non, dateR = st.date / st.non, emailR = st.email / st.non, textR = st.text / st.non;
  const bad = /(rating|target|expected|goal)/.test(n);
  switch (f) {
    case 'date':
      if (dateR < 0.5) return 0;
      if (/\bdate\b/.test(n)) return bad ? 2 : 6 - (/(saved|actual|completed|work|shift|report)/.test(n) ? 0 : 1);
      if (/^(period|day|week|week ending|timestamp|dt)$/.test(n)) return 4;
      return 1;
    case 'id':
      if (emailR >= 0.6) return bad ? 1 : (/(labeler|email|login|user|associate|agent|actual)/.test(n) ? 6 : 4);
      if (textR < 0.5) return 0;
      if (/^(associate|emp|employee|staff|worker|user|agent)? ?(id|no|number|code)$/.test(n) || /^(login|badge|badge id|username|user name|alias|eid|labeler)$/.test(n)) return 5;
      return 0;
    case 'name':
      if (textR < 0.6) return 0;
      if (/name$/.test(n) && !bad) return 5;
      if (/^(associate|associates|employee|staff|worker|agent|person)$/.test(n)) return 4;
      return 0;
    case 'shift': return /^shift( name| type| code)?$/.test(n) ? 5 : 0;
    case 'prs':
      if (numR < 0.5 || BAD_WORDS.test(n)) return 0;
      if (/\bprs\b/.test(n)) return 6;
      if (/(quantity|units|picks|placed|volume|output)/.test(n)) return 4;
      return 0;
    case 'spl':
      if (numR < 0.5 || bad) return 0;
      if (/\bspl\b/.test(n)) return /^(fp )?spl( achieved)?$/.test(n) ? 6 : 4;
      return 0;
    case 'atot':
      if (numR < 0.5 || bad) return 0;
      if (/^atot( %)?$/.test(n)) return 6;
      if (/atot/.test(n)) return /achieved|db/.test(n) ? 5 : 3;
      if (/time on task/.test(n)) return 4;
      return 0;
    case 'quality':
      if (numR < 0.5 || /rating/.test(n)) return 0;
      if (/total accuracy/.test(n)) return 6;
      if (/(accuracy|quality|qa score)/.test(n)) return 4;
      return 0;
  }
  return 0;
}
function guessTab(grid, dayFirst) {
  const width = Math.max(0, ...grid.map(r => r.length));
  const g = { headerRow: -1, layout: 'rows', cols: new Array(width).fill('ignore'), wideMetric: 'prs', note: '' };
  if (!grid.some(r => r.some(v => !isEmpty(v)))) { g.layout = 'skip'; g.note = 'Empty tab.'; return g; }
  const h = detectHeader(grid);
  g.headerRow = h;
  const start = h + 1;
  const stats = [];
  for (let c = 0; c < width; c++) stats[c] = colStats(grid, start, c, dayFirst);
  const hdr = h >= 0 ? grid[h] : [];
  const assign = (f) => {
    let best = -1, bs = 0;
    for (let c = 0; c < width; c++) { if (g.cols[c] !== 'ignore') continue; const s = h >= 0 ? fieldScore(f, hdr[c], stats[c]) : 0; if (s > bs) { bs = s; best = c; } }
    if (best >= 0) g.cols[best] = f;
  };
  // dates across the top?
  const dateHeaderCols = [];
  if (h >= 0) for (let c = 0; c < width; c++) if (!isEmpty(hdr[c]) && toDate(hdr[c], dayFirst, false)) dateHeaderCols.push(c);
  if (dateHeaderCols.length >= 2) {
    let non = 0, num = 0;
    for (const c of dateHeaderCols) { non += stats[c].non; num += stats[c].num; }
    g.layout = 'wide';
    for (const c of dateHeaderCols) g.cols[c] = 'date';
    assign('id'); assign('name'); assign('shift');
    if (!g.cols.includes('id') && !g.cols.includes('name')) {
      const fd = dateHeaderCols[0];
      for (let c = 0; c < fd; c++) { const s = stats[c]; if (s.non && s.text / s.non >= 0.5) { g.cols[c] = s.email / s.non >= 0.6 ? 'id' : 'name'; break; } }
    }
    if (!non || num / non < 0.5) { g.layout = 'skip'; g.note = 'The cells under the dates are mostly not numbers.'; }
    return g;
  }
  if (h >= 0) { for (const f of ['date', 'id', 'name', 'shift', 'prs', 'spl', 'atot', 'quality']) assign(f); }
  else {
    for (let c = 0; c < width; c++) { const s = stats[c]; if (s.non && s.date / s.non >= 0.6) { g.cols[c] = 'date'; break; } }
    for (let c = 0; c < width; c++) { const s = stats[c]; if (g.cols[c] === 'ignore' && s.non && s.email / s.non >= 0.6) { g.cols[c] = 'id'; break; } }
    for (let c = 0; c < width; c++) {
      const s = stats[c]; if (!s.non || g.cols[c] !== 'ignore' || s.text / s.non < 0.6) continue;
      if (!g.cols.includes('id') && s.idLike / s.non >= 0.6) g.cols[c] = 'id';
      else if (!g.cols.includes('name')) g.cols[c] = 'name';
    }
    for (let c = 0; c < width; c++) { const s = stats[c]; if (g.cols[c] === 'ignore' && s.non && s.num / s.non >= 0.6) { g.cols[c] = g.cols.includes('prs') ? 'extra' : 'prs'; } }
  }
  if (!g.cols.includes('id') && !g.cols.includes('name')) {
    for (let c = 0; c < width; c++) { const s = stats[c]; if (g.cols[c] === 'ignore' && s.non && s.text / s.non >= 0.6) { g.cols[c] = s.email / s.non >= 0.6 ? 'id' : 'name'; break; } }
  }
  const hasPerson = g.cols.includes('id') || g.cols.includes('name');
  const hasMetric = ['prs', 'spl', 'atot', 'quality'].some(f => g.cols.includes(f));
  const hasDate = g.cols.includes('date');
  if (!hasPerson || !hasMetric) { g.layout = 'skip'; g.note = !hasPerson ? 'No column of associate emails, IDs or names found.' : 'No PRS, SPL, ATOT or Quality column found.'; }
  else if (!hasDate) { g.layout = 'skip'; g.note = 'No date column found, so this looks like a summary tab. Switch it on to save its numbers under the import date.'; }
  return g;
}

/* Build records from all tabs. Never throws for data problems; returns warnings. */
function buildRecords(tabs, maps, opts) {
  const dayFirst = !!opts.dayFirst, today = opts.today;
  const people = {};
  const warnings = [];
  const stats = { tabsRead: tabs.length, rowsRead: 0, cellsRead: 0, dataRows: 0, values: 0 };
  const warn = (t) => { warnings.push(t); };
  const src = opts.sources || {}, aggRule = opts.agg || {};
  const allowed = (k, tabName) => !src[k] || src[k] === tabName;
  tabs.forEach((tab, ti) => {
    const grid = tab.grid;
    const agg = {};
    for (const row of grid) { let any = false; for (const v of row) if (!isEmpty(v)) { stats.cellsRead++; any = true; } if (any) stats.rowsRead++; }
    const m = maps[ti];
    if (!m || m.layout === 'skip') return;
    const hdr = m.headerRow >= 0 ? grid[m.headerRow] : [];
    const colName = (c) => (hdr && !isEmpty(hdr[c])) ? String(hdr[c]).trim() : 'Column ' + colLetter(c);
    const idx = (f) => m.cols.indexOf(f);
    const ci = { id: idx('id'), name: idx('name'), shift: idx('shift') };
    for (let r = m.headerRow + 1; r < grid.length; r++) {
      const row = grid[r] || [];
      if (!row.some(v => !isEmpty(v))) continue;
      const pid = ci.id >= 0 && !isEmpty(row[ci.id]) ? String(row[ci.id]).trim() : '';

  for (const k of keys) {
    const cur = S.recs[k] || { records: {}, notes: [] };
    const notes = [...(cur.notes || []), { id: uid8(), at, type, text }].slice(-40);
    const next = { ...cur, notes };
    S.recs[k] = next;
    await write('recs/' + k, next);
    await pushPerf(k);
  }
}

async function sendReminders(list, date, why, onProgress) {

  openEmailQueue('Reminder emails' + (why ? ' (' + why + ')' : '') + ' for ' + niceDate(date), items);
  audit('Prepared reminder emails' + (why ? ' (' + why + ')' : '') + ' for ' + list.length + ' associate(s).');

async function sendRemindersUnused(list, date, why, onProgress) {
  const res = { inapp: 0, sent: 0, failed: 0, noEmail: 0, err: '' };
  try { await addNote(list.map(m => m.key), 'Reminder from your supervisor: please update your PRS' + (why ? ' (' + why + ')' : '') + '.', 'reminder'); res.inapp = list.length; } catch (e) { }
  if (S.settings.emailReminders !== false) {
    const withEmail = list.filter(m => m.email && !m.needsEmail);
    res.noEmail = list.length - withEmail.length;
    let stop = false;
    for (let i = 0; i < withEmail.length; i++) {
      if (stop) { res.failed++; continue; }
      if (i && i % 10 === 0) await new Promise(r => setTimeout(r, 1500));
      const m = withEmail[i]; const { subject, body } = reminderEmail(m, date);
      let ok = false;
      for (let tries = 0; tries < 2 && !ok; tries++) {
        try { await gmailSend(m.email, subject, body); ok = true; }
        catch (er) {
          if (!res.err) res.err = gmailErr(er);
          if (er && AUTH_CODES.includes(er.code)) { stop = true; break; }
          await new Promise(r => setTimeout(r, 1000));
        }
      }
      if (ok) res.sent++; else res.failed++;
      if (onProgress) onProgress(i + 1, withEmail.length);
    }
  }
  audit('Sent a reminder' + (why ? ' (' + why + ')' : '') + ' to ' + list.length + ' associate(s): ' + res.sent + ' email(s) sent' + (res.failed ? ', ' + res.failed + ' failed' : '') + '.');

}

/* timer: scheduled reminders and messages (runs while a supervisor has the tracker open) */
async function tick() {
  if (S.role !== 'sup' || !S.loaded.settings || !S.loaded.remlog || !S.loaded.msglog) return;
  if (S.reminding) return;
  const np = nowParts(); const t = np.date; const nm = np.min;
  const sent = { ...(S.remlog.sent || {}) };
  const due = []; let changed = false;
  for (const rt of (S.settings.reminderTimes || [])) {
    const k = t + ' ' + rt; const m = toMin(rt);
    if (!sent[k] && nm >= m && nm - m <= 30) { sent[k] = true; changed = true; due.push({ why: rt + ' check-in', all: true }); }
  }
  const be = +S.settings.remindBeforeEnd || 0;
  const endList = [];
  if (be > 0) for (const m of members()) {
    const at = toMin(m.start || '07:00') + (+S.settings.shiftHours || 8) * 60 - be;
    const k = t + ' end ' + m.key; const el = elapsedMins(t, m.start) - ((+S.settings.shiftHours || 8) * 60 - be);
    if (!sent[k] && el >= 0 && el <= 30) { sent[k] = true; changed = true; endList.push(m); }
    void at;
  }
  if (changed) { const keep = {}; for (const k in sent) if (k.startsWith(t)) keep[k] = true; S.remlog = { sent: keep }; await write('sup/remlog', { sent: keep }); }
  if (due.length || endList.length) {
    S.reminding = true;
    try {
      if (S.source && S.source.fileId && Date.now() - (S.source.lastSync || 0) > 120000) await syncNow(true);
      const pick = (ms) => ms.filter(m => needsReminder(dayInfo(m, t)));
      if (due.length) { const list = pick(members()); if (list.length) { const r = await sendReminders(list, t, due[0].why); toast('Scheduled reminder: ' + reminderSummary(r)); } }
      if (endList.length) { const list = pick(endList); if (list.length) { const r = await sendReminders(list, t, be + ' min before shift end'); toast('End-of-shift reminder: ' + reminderSummary(r)); } }
    } finally { S.reminding = false; }
  }
  const items = [...(S.msglog.items || [])]; let mchg = false;
  for (const it of items) {
    if (!it.sent && it.scheduledFor && it.scheduledFor <= Date.now()) {
      it.sent = true; it.sentAt = Date.now(); mchg = true;
      await addNote(it.to, it.subject + ': ' + it.body, 'message');
      toast('Scheduled message "' + it.subject + '" delivered in the app. Open Messages to email it.');
    }
  }
  if (mchg) await write('sup/msglog', { items: items.slice(-200) });
}

const pctOf = (n, d) => d ? Math.round(n / d * 100) + '%' : '–';
function cautionsFor(key, date) { return ((S.cautions && S.cautions.items) || []).filter(c => c.memberKey === key && (!date || c.date === date)); }
function belowAlerts() {
  const ms = members(); const ds = allDates(); const f = S.filt; const today = todayStr();
  const last = ds.length ? ds[ds.length - 1] : today;
  const to = f.to || (last > today ? last : today);
  const from = f.from || (ds.length ? ds[Math.max(0, ds.length - 7)] : addDays(today, -6));
  const al = (S.alerts && S.alerts.items) || {};
  const out = [];
  for (const m of ms) {
    if (f.shift && m.shift !== f.shift) continue;
    if (f.who && m.key !== f.who) continue;
    for (const d in recOf(m.key)) {
      if (d < from || d > to) continue;
      const di = dayInfo(m, d);
      if (di.prs == null || !(di.st === 'red' || di.st === 'yellow')) continue;
      const id = m.key + '|' + d; const cs = cautionsFor(m.key, d);
      const state = al[id] && al[id].status === 'dismissed' ? 'Dismissed' : cs.some(c => c.status === SENT_STATUS) ? 'Caution sent' : 'Open';
      if ((f.show || 'open') === 'open' && state !== 'Open') continue;
      out.push({ m, d, id, state, cs, ...di });
    }
  }
  out.sort((x, y) => y.d.localeCompare(x.d) || (x.prs - x.exp) - (y.prs - y.exp));
  return { out, from, to };
}

function metricList() {
  const base = [['prs', 'PRS'], ['spl', 'SPL'], ['atot', 'ATOT'], ['quality', 'Quality %']];
  const ex = new Set();
  for (const k in S.recs) for (const d in (S.recs[k].records || {})) for (const x in ((S.recs[k].records[d] || {}).x || {})) ex.add(x);
  return base.concat([...ex].sort().map(x => ['x:' + x, x]));
}
function metricVal(r, metric) { if (!r) return null; if (metric.startsWith('x:')) return r.x ? r.x[metric.slice(2)] ?? null : null; return r[metric] ?? null; }
function bucket(d, group) {
  if (group === 'day') return d;
  if (group === 'month') return d.slice(0, 7);
  const dd = new Date(d + 'T12:00:00'); const day = (dd.getDay() + 6) % 7; dd.setDate(dd.getDate() - day);
  return dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0') + '-' + String(dd.getDate()).padStart(2, '0');
}
function seriesFor(keys, metric, range, group) {
  const ds = allDates(); if (!ds.length) return { labels: [], vals: [] };
  const end = ds[ds.length - 1]; const start = addDays(end, -range + 1);
  const b = {};
  for (const k of keys) for (const d in recOf(k)) {
    if (d < start || d > end) continue;
    const v = metricVal(recOf(k)[d], metric); if (v == null) continue;
    const bk = bucket(d, group); (b[bk] = b[bk] || []).push(v);
  }
  const labels = Object.keys(b).sort();
  const avg = metric === 'prs' || !metric.startsWith('x:') ? (a) => a.reduce((s, x) => s + x, 0) / a.length : (a) => a.reduce((s, x) => s + x, 0) / a.length;
  return { labels, vals: labels.map(l => Math.round(avg(b[l]) * 10) / 10) };
}
function viewTrends() {
  const ms = members(); const t = S.trend; const mets = metricList();
  return `<h1>Trends</h1><p class="sub">Averages per associate per shift. Pick a person to see their own line.</p>
  <div class="panel row">
    <label class="f">Metric<select data-trend="metric">${mets.map(([k, l]) => `<option value="${esc(k)}" ${t.metric === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    <label class="f">Associate<select data-trend="who"><option value="">Whole team (average)</option>${ms.map(m => `<option value="${m.key}" ${t.who === m.key ? 'selected' : ''}>${esc(label(m))}</option>`).join('')}</select></label>
    <label class="f">Range<select data-trend="range">${[[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days'], [365, 'Last year']].map(([v, l]) => `<option value="${v}" ${+t.range === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="f">Group by<select data-trend="group">${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']].map(([v, l]) => `<option value="${v}" ${t.group === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
  </div>

  <div class="panel"><h2>Latest shift by associate</h2><div class="chartbox" style="height:${Math.max(220, ms.length * 26)}px"><canvas id="teamBar" aria-label="PRS by associate"></canvas></div></div>`;

  S.syncing = true; S.syncMsg = 'Downloading the latest sheet from Google…'; if (!silent || S.view === 'data') doRender();
  try {
    const b = await fetchDriveBook(src.fileId);
    S.syncMsg = 'Reading every tab…'; if (S.view === 'data') doRender(); await pause();
    const book = readBook(b.bytes, b.title); S.book = book;
    const maps = mapsFor(book.tabs);
    S.syncMsg = 'Saving changes…'; if (S.view === 'data') doRender();
    const res = await importBook(book, maps, { storeRaw: false, replace: true });
    const review = book.tabs.filter((t, i) => maps[i].paused).map(t => t.name.trim());
    await setSource({ ...src, title: b.title, lastSync: Date.now(), lastResult: { ...res.summary, review, warnings: res.warnings.slice(0, 100) }, lastError: null });
    if (!silent) toast('Synced: ' + res.summary.updated + ' days updated, ' + res.summary.created + ' new.');
  } catch (e) {
    const msg = driveErr(e);
    try { await setSource({ ...src, lastError: msg, lastErrorAt: Date.now() }); } catch (er) { }
    if (!silent) toast(msg);
  }
  S.syncing = false; S.syncMsg = ''; render();
}
async function autoSync() {
  if (S.role !== 'sup' || !S.source || !S.source.fileId || S.syncing || document.hidden || S.parsed) return;
  const every = Math.max(5, +S.settings.syncMins || 15) * 60000;
  if (Date.now() - (S.source.lastSync || 0) >= every) syncNow(true);
}
async function handleFile(file) {

    S.book = book;
    S.parsed = book; S.parseMaps = mapsFor(book.tabs, true); S.parseTab = Math.max(0, S.parseMaps.findIndex(m => m.layout !== 'skip')); S.importResult = null;

}
function nameFromEmail(e) {
  const m = /^([^@]+)@/.exec(e || ''); if (!m) return '';
  return m[1].split(/[._\-]+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim());
async function importBook(p, maps, opt) {
  const cands = sourceCandidates(p.tabs, maps);
  const sources = pickSources(cands, S.settings.sources);
  const res = buildRecords(p.tabs, maps, { dayFirst: S.settings.dayFirst, today: todayStr(), sources, agg: { ...DEFAULT_SETTINGS.agg, ...(S.settings.agg || {}) } });
  const replace = !!(opt && opt.replace);
  const prevSrc = (S.mapping && S.mapping.sources) || {};
  const pausedNames = new Set(p.tabs.filter((t, i) => maps[i].paused).map(t => t.name));
  const keep = METRICS.map(([f]) => f).filter(f => sources[f] === '__none__' && pausedNames.has(prevSrc[f]));
  const keepOnly = (r) => { if (!r) return null; const o = {}; for (const f of keep) if (r[f] != null) o[f] = r[f]; return Object.keys(o).length ? o : null; };
  const team = { ...(S.team.members || {}) };
  const byId = {}, byName = {};
  for (const m of Object.values(team)) { if (m.aid) byId[normKey(m.aid)] = m.key; if (m.email && !m.needsEmail) byId[normKey(m.email)] = byId[normKey(m.email)] || m.key; if (m.name) byName[normKey(m.name)] = m.key; }
  let added = 0, created = 0, updated = 0, teamChanged = false;
  const touched = {};
  for (const pk in res.people) {
    const pp = res.people[pk];
    if (!Object.keys(pp.dates).length) continue;
    let key = (pp.id && byId[normKey(pp.id)]) || (pp.name && byName[normKey(pp.name)]);
    const em = isEmail(pp.id) ? pp.id.trim().toLowerCase() : '';
    if (!key) {
      key = memberKey(pp.id || pp.name);
      team[key] = { key, name: pp.name || nameFromEmail(em), aid: pp.id || '', email: em, needsEmail: !em, shift: pp.shift || '', start: '07:00', days: [1, 2, 3, 4, 5], leave: [], uid: null, added: Date.now(), status: 'pending' };
      if (pp.id) byId[normKey(pp.id)] = key; if (pp.name) byName[normKey(pp.name)] = key;
      added++; teamChanged = true;
    } else {
      const m = team[key]; const nm = { ...m };
      if (!nm.name && (pp.name || em)) nm.name = pp.name || nameFromEmail(em);
      if (!nm.aid && pp.id) nm.aid = pp.id;
      if (!nm.shift && pp.shift) nm.shift = pp.shift;
      if (nm.needsEmail && em) { nm.email = em; nm.needsEmail = false; }
      if (JSON.stringify(nm) !== JSON.stringify(m)) { team[key] = nm; teamChanged = true; }
    }
    const prev = (S.recs[key] && S.recs[key].records) || {};
    const base = touched[key] || S.recs[key] || { records: {}, notes: [] };
    /* a full Google Sheet sync rebuilds each person's days from the chosen sources, so a changed source never leaves old numbers behind */
    let startRecs = {};
    if (replace && keep.length) for (const d in prev) { const k2 = keepOnly(prev[d]); if (k2) startRecs[d] = k2; }
    const cur = { ...base, records: touched[key] || !replace ? { ...(base.records || {}) } : startRecs };
    for (const d in pp.dates) {
      const v = pp.dates[d]; const old = prev[d];
      const rec = replace ? { ...(cur.records[d] || {}) } : { ...(cur.records[d] || old || {}) };
      for (const f of ['prs', 'spl', 'atot', 'quality']) if (v[f] != null) rec[f] = v[f];
      if (Object.keys(v.x || {}).length) rec.x = { ...(rec.x || {}), ...v.x };
      if (!old) created++; else if (JSON.stringify(old) !== JSON.stringify(rec)) updated++;
      cur.records[d] = rec;
    }
    touched[key] = cur;
  }
  if (teamChanged) { S.team = { members: team }; await saveTeam(team); }
  const changed = [];
  for (const k in touched) {
    if (JSON.stringify(touched[k]) === JSON.stringify(S.recs[k] || null)) continue;
    S.recs[k] = touched[k]; await write('recs/' + k, touched[k]); changed.push(k);
  }
  const mp = { ...((S.mapping && S.mapping.tabs) || {}) };
  p.tabs.forEach((t, i) => { const m = maps[i]; if (m.paused) return; mp[t.name] = { sig: headerSignature(t.grid, m.headerRow), headerRow: m.headerRow, layout: m.layout, cols: m.cols, wideMetric: m.wideMetric || 'prs' }; });
  const savedSources = { ...sources }; for (const f of keep) savedSources[f] = prevSrc[f];
  const nextMap = { tabs: mp, cands, sources: savedSources };
  if (JSON.stringify(nextMap) !== JSON.stringify(S.mapping || {})) { S.mapping = nextMap; await write('sup/mapping', nextMap); }
  if (opt && opt.storeRaw) await saveRaw(p);
  else await write('sup/rawmeta', { file: p.file, at: Date.now(), tabs: p.tabs.map(t => ({ name: t.name, rows: t.grid.length, cols: t.grid[0] ? t.grid[0].length : 0, chunks: 0 })), stored: false, fromDrive: true });
  for (const k of changed) { try { await pushPerf(k); } catch (e) { } }
  autoLink();
  const summary = { tabsRead: res.stats.tabsRead, tabsUsed: maps.filter(m => m.layout !== 'skip').length, rowsRead: res.stats.rowsRead, cellsRead: res.stats.cellsRead, created, updated, added, sources: savedSources, paused: keep };
  if (added) audit(added + ' new associate(s) found in the sheet, waiting for approval.');
  return { summary, warnings: res.warnings, stats: res.stats };
}
async function runImport() {
  const btn = $('#doImport'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const p = S.parsed, maps = S.parseMaps;
    maps.forEach(m => { delete m.paused; });
    const r = await importBook(p, maps, { storeRaw: !p.fromDrive, replace: !!p.fromDrive });
    audit('Confirmed column mappings for ' + p.tabs.filter((t, i) => maps[i].layout !== 'skip').map(t => t.name.trim()).join(', ') + '.');
    if (p.fromDrive && S.source) await setSource({ ...S.source, lastSync: Date.now(), lastResult: { ...r.summary, review: [], warnings: r.warnings.slice(0, 100) }, lastError: null });
    S.importResult = { stats: r.stats, warnings: r.warnings, added: r.summary.added, created: r.summary.created, updated: r.summary.updated };
    S.parsed = null; S.parseMaps = null; S.rawCache = {};

async function saveRaw(p) {
  const total = p.tabs.reduce((s, t) => s + JSON.stringify(t.grid).length, 0);
  if (total > 3000000) {
    const old = await S.db.collection('raw').get().catch(() => null);
    if (old) for (const d of old.docs) await del('raw/' + d.id).catch(() => { });
    await write('sup/rawmeta', { file: p.file, at: Date.now(), tabs: p.tabs.map(t => ({ name: t.name, rows: t.grid.length, cols: t.grid[0] ? t.grid[0].length : 0, chunks: 0 })), stored: false });
    return;
  }
  const docs = [];
  const tabsMeta = [];
  p.tabs.forEach((t, ti) => {
    let chunk = { rows: {} }, size = 0, ci = 0;
    const flush = () => { docs.push({ id: 't' + ti + '-c' + ci, data: { tab: ti, chunk: ci, rows: chunk.rows } }); ci++; chunk = { rows: {} }; size = 0; };
    t.grid.forEach((row, ri) => {
      if (!row.some(v => !isEmpty(v))) return;
      let last = row.length - 1; while (last >= 0 && isEmpty(row[last])) last--;
      const r = row.slice(0, last + 1);
      const s = JSON.stringify(r).length + 12;
      if (size + s > 180000 && size > 0) flush();
      chunk.rows['r' + ri] = r; size += s;
    });
    if (size > 0 || ci === 0) flush();
    tabsMeta.push({ name: t.name, rows: t.grid.length, cols: t.grid[0] ? t.grid[0].length : 0, chunks: ci });
  });
  const old = await S.db.collection('raw').get().catch(() => null);
  const keep = new Set(docs.map(d => d.id));
  for (const d of docs) await write('raw/' + d.id, d.data);
  if (old) for (const d of old.docs) if (!keep.has(d.id)) await del('raw/' + d.id).catch(() => { });
  await write('sup/rawmeta', { file: p.file, at: Date.now(), tabs: tabsMeta, stored: true });
}

    const sources = {}; document.querySelectorAll('[data-src]').forEach(x => { if (x.value) sources[x.dataset.src] = x.value; });
    const agg = { ...DEFAULT_SETTINGS.agg }; document.querySelectorAll('[data-agg]').forEach(x => { agg[x.dataset.agg] = x.value; });
    const old = { ...S.settings, tz: S.settings.tz || browserTz() };
    const next = { target: Math.max(1, +$('#stTarget').value || 408), shiftHours: Math.max(1, +$('#stHours').value || 8), warnPct: Math.min(50, Math.max(1, +$('#stWarn').value || 10)), dayFirst: $('#stDay').value === '1', tz,
      reminderTimes: rt, remindBeforeEnd: Math.max(0, +$('#stBefore').value || 0), emailReminders: $('#stEmail').checked, confirmEnabled: false, supervisorName: $('#stName').value.trim(), dtApproval: $('#stDtAppr').checked,
      syncMins: Math.min(240, Math.max(5, +$('#stSync').value || 15)), sources: document.querySelector('[data-src]') ? sources : (old.sources || {}), agg: document.querySelector('[data-agg]') ? agg : (old.agg || DEFAULT_SETTINGS.agg),
      cautionSubject: $('#stCSubj').value.trim() || DEFAULT_SETTINGS.cautionSubject, cautionTemplate: $('#stCTpl').value.trim() || DEFAULT_SETTINGS.cautionTemplate };
    const NAMES = { target: 'PRS target', shiftHours: 'Shift length', warnPct: 'Slightly-behind tolerance', dayFirst: 'Date format', tz: 'Time zone', reminderTimes: 'Reminder times', remindBeforeEnd: 'Minutes before shift end', emailReminders: 'Email reminders', confirmEnabled: '"Confirm my data"', dtApproval: 'Downtime approval', supervisorName: 'Your name', syncMins: 'Sync interval', sources: 'Metric sources', agg: 'How rows are combined', cautionSubject: 'Caution subject', cautionTemplate: 'Caution message' };
    const show = (v) => typeof v === 'boolean' ? (v ? 'on' : 'off') : Array.isArray(v) ? (v.join(', ') || 'none') : (v && typeof v === 'object') ? Object.entries(v).map(([k, x]) => k + ': ' + String(x).trim()).join(', ') || 'automatic' : String(v);
    const diffs = Object.keys(NAMES).filter(k => JSON.stringify(old[k] ?? DEFAULT_SETTINGS[k]) !== JSON.stringify(next[k])).map(k => NAMES[k] + ' from ' + show(old[k] ?? DEFAULT_SETTINGS[k]) + ' to ' + show(next[k]));
    S.settings = { ...DEFAULT_SETTINGS, ...next }; S.myName = next.supervisorName || 'Supervisor'; await write('sup/settings', next);
    if (diffs.length) audit('Changed ' + diffs.join('; ') + '.');
    await pushAll(); toast('Settings saved.'); pending = false; doRender();
    const dataChanged = JSON.stringify(old.sources || {}) !== JSON.stringify(next.sources) || JSON.stringify(old.agg || DEFAULT_SETTINGS.agg) !== JSON.stringify(next.agg);
    if (dataChanged && S.source && S.source.fileId) syncNow(false);
    return;
  }
  if (t.dataset.appr || t.id === 'apprAll') {
    const keys = t.id === 'apprAll' ? pendingMembers().map(m => m.key) : [t.dataset.appr];
    if (t.id === 'apprAll' && !confirm('Approve all ' + keys.length + ' new associates?')) return;
    const all = { ...S.team.members };
    for (const k of keys) { const inp = document.querySelector('[data-pname="' + k + '"]'); all[k] = { ...all[k], status: 'active', name: inp && inp.value.trim() ? inp.value.trim() : all[k].name }; }
    S.team = { members: all }; await saveTeam(all);
    audit('Approved ' + (keys.length === 1 ? label(all[keys[0]]) : keys.length + ' new associates') + '.');
    autoLink(); toast('Approved ' + keys.length + '.'); pending = false; return doRender();
  }
  if (t.dataset.ign || t.dataset.unign) {
    const k = t.dataset.ign || t.dataset.unign; const all = { ...S.team.members };
    all[k] = { ...all[k], status: t.dataset.ign ? 'ignored' : 'pending' }; S.team = { members: all }; await saveTeam(all);
    audit((t.dataset.ign ? 'Ignored ' : 'Moved back to approval: ') + label(all[k]) + '.'); pending = false; return doRender();
  }
});

/* ================= associate ================= */
function startAssoc() {
  if (!S.uid) return fatal('Please sign in', 'Sign in to claude.ai to see your PRS progress.');
  let regd = false;
  S.db.doc('perf/' + S.uid).onSnapshot(s => {
    S.me = s.exists && !s.data().removed ? s.data() : false;
    if (S.me === false && !regd) { regd = true; S.db.doc('reg/' + S.uid).set({ at: Date.now() }).catch(() => { }); }
    render();
  }, () => { S.me = false; render(); });
  S.db.doc('conf/' + S.uid).onSnapshot(s => { S.myConf = s.exists ? s.data() : { days: {} }; render(); }, () => { });
}
function aDayInfo(date) {
  const me = S.me; const st = me.settings || DEFAULT_SETTINGS;
  const r = (me.records || {})[date];
  let mins = 0; const reasons = []; for (const d of (me.downtime || [])) if (d.date === date) { mins += d.mins; reasons.push(d.reason); }
  const adj = adjTarget(st, mins); const exp = expected(st, adj, date, me.start, mins);
  const prs = r && r.prs != null ? r.prs : null;
  return { r, adj, exp, prs, mins, reasons, st: scheduleStatus(me.days, me.leave, date, me.start, prs) || status(prs, exp, st.warnPct) };
}
function missedDays(me) {
  const recs = me.records || {}; const ds = Object.keys(recs).sort();
  const t = todayStr(); const first = ds.length ? ds[0] : addDays(t, -14);
  const startD = first < addDays(t, -90) ? addDays(t, -90) : first;
  const leave = new Set(me.leave || []); const days = me.days || [1, 2, 3, 4, 5];
  const out = []; let d = startD;
  while (d < t) { if (days.includes(dow(d)) && !leave.has(d) && !recs[d]) out.push(d); d = addDays(d, 1); }
  return out;
}
function ring(pct, st) {
  const r = 70, c = 2 * Math.PI * r; const p = Math.max(0, Math.min(1, pct));
  const col = { green: 'var(--ok)', yellow: 'var(--warn)', red: 'var(--bad)' }[st] || 'var(--line)';
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="${Math.round(p * 100)}% of target"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="18"/>
  <circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 90 90)"/>
  <text x="90" y="88" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="40" fill="var(--ink)">${Math.round(p * 100)}%</text>
  <text x="90" y="112" text-anchor="middle" font-family="Barlow, sans-serif" font-size="14" fill="var(--muted)">of target</text></svg>`;
}
function renderAssoc() {
  $('#nav').hidden = true;
  if (S.me === null) return '<p class="muted">Loading your progress…</p>';
  if (S.me === false) return '<div class="state"><h1>You\'re almost set up</h1><p class="muted">Your supervisor can now see that you opened the tracker. Once they link your account on their Team page, your numbers will appear here.</p></div>';
  const me = S.me; const recs = me.records || {}; const ds = Object.keys(recs).sort();
  const t = todayStr(); const date = recs[t] || !ds.length ? t : ds[ds.length - 1];
  const di = aDayInfo(date);
  const diff = di.prs == null ? null : di.prs - di.exp;
  const msg = di.st === 'off' ? "It's your day off. Enjoy it!" : di.st === 'leave' ? "You're on leave today." : di.st === 'later' ? "Your shift hasn't started yet. Your target today is " + fmt(di.adj) + '.'
    : di.prs == null ? 'No PRS recorded for this shift yet. Please update your PRS.'
    : di.prs >= di.adj ? (date === t ? "You've reached today's target. Nice work!" : 'Target reached. Great work!')
    : date === t ? `You need ${fmt(di.adj - di.prs)} more to reach today's target. ${diff >= 0 ? `You're ${fmt(diff)} ahead of pace.` : `You're ${fmt(-diff)} behind pace.`}`
    : `You finished ${fmt(di.adj - di.prs)} short of target.`;
  const missed = missedDays(me);
  const notes = [...(me.notes || [])].reverse();
  const seen = S.myConf.seen || 0;
  const confOn = !!(me.settings && me.settings.confirmEnabled);
  const unconf = confOn ? ds.filter(d => !(S.myConf.days || {})[d]).slice(-7).reverse() : [];
  const av = S.aView;
  const month = av.month || t.slice(0, 7);
  return `<h1>Hi ${esc((me.name || '').split(' ')[0] || 'there')}</h1>
  <p class="sub">${date === t ? 'Today' : 'Latest shift'}: ${esc(niceDate(date))}</p>
  <div class="panel"><div class="ringwrap">${ring(di.adj ? (di.prs || 0) / di.adj : 0, di.st)}
    <div><div class="big">${fmt(di.prs)} <small>/ ${fmt(di.adj)} PRS</small></div>
    <p style="margin:8px 0"><span class="chip ${STATUS_CHIP[di.st]}">${STATUS_TXT[di.st]}</span></p>
    <p style="margin:0;font-size:18px">${esc(msg)}</p>
    ${di.mins ? `<p class="small muted">Your target was lowered by ${fmt(di.mins)} min of downtime (${esc([...new Set(di.reasons)].join(', '))}).</p>` : ''}
    ${di.r ? `<p class="small muted">SPL ${fmt(di.r.spl, 1)} · ATOT ${fmt(di.r.atot, 1)} · Quality ${di.r.quality != null ? fmt(di.r.quality, 1) + '%' : '–'}</p>` : ''}</div></div></div>
  ${notes.length ? `<div class="panel"><h2>Messages ${notes.some(n => n.at > seen) ? '<span class="chip red">New</span>' : ''}</h2><ul class="list">${notes.slice(0, 6).map(n => `<li><span class="chip ${n.type === 'reminder' ? 'yellow' : 'info'}">${n.type === 'reminder' ? 'Reminder' : 'Message'}</span> <span class="small muted">${esc(niceTime(n.at))}</span><div style="white-space:pre-wrap;margin-top:4px">${esc(n.text)}</div></li>`).join('')}</ul>
  ${notes.some(n => n.at > seen) ? '<button class="btn small" id="aSeen">Mark as read</button>' : ''}</div>` : ''}
  ${unconf.length ? `<div class="panel"><h2>Confirm your data</h2><p class="small muted">Check your numbers and confirm each day is complete. Your supervisor sees your confirmation.</p><ul class="list">${unconf.map(d => { const r = recs[d]; return `<li class="row" style="justify-content:space-between"><span><strong>${esc(niceDate(d))}</strong>: PRS ${fmt(r.prs)}${r.spl != null ? ', SPL ' + fmt(r.spl, 1) : ''}${r.atot != null ? ', ATOT ' + fmt(r.atot, 1) : ''}${r.quality != null ? ', Quality ' + fmt(r.quality, 1) + '%' : ''}</span><button class="btn small pri" data-aconf="${d}">Confirm my data</button></li>`; }).join('')}</ul></div>` : ''}
  <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">My progress</h2>
    <div class="tabs" style="margin:0">${[['prs', 'PRS'], ['spl', 'SPL'], ['atot', 'ATOT'], ['quality', 'Quality']].map(([k, l]) => `<button data-am="${k}" aria-pressed="${av.metric === k}">${l}</button>`).join('')}
    <button data-ar="week" aria-pressed="${av.range === 'week'}">Week</button><button data-ar="month" aria-pressed="${av.range === 'month'}">Month</button></div></div>
    <div class="chartbox" style="margin-top:10px"><canvas id="aChart" aria-label="My progress chart"></canvas></div></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Missed days</h2>
    <span><button class="btn small" data-amon="-1" aria-label="Previous month">‹</button> <strong>${new Date(month + '-15T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</strong> <button class="btn small" data-amon="1" aria-label="Next month">›</button></span></div>
    <p class="small muted">${missed.length ? `You have <strong style="color:var(--bad)">${missed.length}</strong> scheduled day(s) with no data in the last 90 days. They're marked in red.` : 'No missed days. Nice!'} Tap a day to see its numbers.</p>
    ${calendar(month, me, missed)}
    ${av.sel ? dayDetail(av.sel) : ''}</div>`;
}
function calendar(month, me, missed) {
  const ms = new Set(missed); const recs = me.records || {}; const conf = S.myConf.days || {};
  const first = month + '-01'; const startDow = dow(first);
  const [y, m] = month.split('-').map(Number); const n = new Date(y, m, 0).getDate();
  let h = '<div class="cal">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) h += '<div></div>';
  const days = me.days || [1, 2, 3, 4, 5]; const leave = new Set(me.leave || []);
  for (let d = 1; d <= n; d++) {
    const ds = month + '-' + String(d).padStart(2, '0');
    const cls = [ms.has(ds) ? 'miss' : recs[ds] ? 'has' : '', conf[ds] ? 'conf' : '', (!days.includes(dow(ds)) || leave.has(ds)) && !recs[ds] ? 'off' : '', S.aView.sel === ds ? 'sel' : ''].join(' ');
    h += `<button class="${cls}" data-aday="${ds}" aria-label="${esc(niceDate(ds))}">${d}<span class="dot">${conf[ds] ? '✓' : ms.has(ds) ? 'missed' : recs[ds] ? fmt(recs[ds].prs) : ''}</span></button>`;
  }
  return h + '</div>';
}
function dayDetail(d) {
  const r = (S.me.records || {})[d]; const c = (S.myConf.days || {})[d];
  if (!r) return `<div class="panel" style="margin:14px 0 0;background:var(--surface2)"><strong>${esc(niceDate(d))}</strong><p class="small muted" style="margin:4px 0 0">No data for this day. If you worked, update your PRS in the company system so it shows up here after the next import.</p></div>`;
  const di = aDayInfo(d);
  return `<div class="panel" style="margin:14px 0 0;background:var(--surface2)"><strong>${esc(niceDate(d))}</strong>
  <p style="margin:6px 0">PRS <strong>${fmt(r.prs)}</strong> of ${fmt(di.adj)} · SPL ${fmt(r.spl, 1)} · ATOT ${fmt(r.atot, 1)} · Quality ${r.quality != null ? fmt(r.quality, 1) + '%' : '–'}</p>
  ${!(S.me.settings && S.me.settings.confirmEnabled) ? '' : c ? '<span class="chip green">✓ Confirmed</span>' : `<button class="btn pri small" data-aconf="${d}">Confirm my data</button>`}</div>`;
}
function afterAssoc() {
  if (!S.me || !chartDefaults()) return;
  const c = $('#aChart'); if (!c) return;
  const recs = S.me.records || {}; const t = todayStr(); const n = S.aView.range === 'week' ? 7 : 30;
  const labels = [], vals = []; for (let i = n - 1; i >= 0; i--) { const d = addDays(t, -i); labels.push(niceDate(d)); vals.push(recs[d] ? recs[d][S.aView.metric] ?? null : null); }
  const ds = [{ label: 'You', data: vals, backgroundColor: cssVar('--accent'), borderColor: cssVar('--accent'), spanGaps: true, tension: .25 }];
  if (S.aView.metric === 'prs') ds.push({ type: 'line', label: 'Target', data: labels.map(() => (S.me.settings || DEFAULT_SETTINGS).target), borderColor: cssVar('--bad'), borderDash: [6, 4], pointRadius: 0, borderWidth: 2 });
  charts.a = new Chart(c, { type: S.aView.metric === 'prs' ? 'bar' : 'line', data: { labels, datasets: ds }, options: { maintainAspectRatio: false, plugins: { legend: { display: ds.length > 1 } } } });
}
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || S.role !== 'assoc') return;
  if (t.dataset.am) { S.aView.metric = t.dataset.am; return doRender(); }
  if (t.dataset.ar) { S.aView.range = t.dataset.ar; return doRender(); }
  if (t.dataset.aday) { S.aView.sel = S.aView.sel === t.dataset.aday ? null : t.dataset.aday; return doRender(); }
  if (t.dataset.amon) { const cur = S.aView.month || todayStr().slice(0, 7); const [y, m] = cur.split('-').map(Number); const d = new Date(y, m - 1 + (+t.dataset.amon), 15); S.aView.month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); return doRender(); }
  if (t.dataset.aconf || t.id === 'aSeen') {
    const next = { days: { ...(S.myConf.days || {}) }, seen: S.myConf.seen || 0 };
    if (t.dataset.aconf) next.days[t.dataset.aconf] = Date.now(); else next.seen = Date.now();
    S.myConf = next;
    try { await S.db.doc('conf/' + S.uid).set(next); if (t.dataset.aconf) toast('Confirmed. Your supervisor can see it.'); }
    catch (er) { toast('Could not save. Ask your supervisor to give you Contributor access to the tracker.'); }
    return doRender();
  }
});
